stages:
  - test        
  - build_image 
  - deploy      

test_app:
  stage: test
  image: node:18-alpine
  only:
    - tags
  script:
    - echo "Preparing test environment..."
    - npm install
    - echo "Run unit tests..."
    - npm test --if-present 
    - echo "All Test Passed!"

build_image:
  stage: build_image
  image: docker:latest 
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: "" 
  only:
    - tags 
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
    - docker build -t $DOCKER_USER/todo-app:$CI_COMMIT_TAG . # tags
    - docker push $DOCKER_USER/todo-app:$CI_COMMIT_TAG

deploy_server:
  stage: deploy
  image: alpine:latest
  only:
    - tags
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "$PRIVATE_KEY" > id_rsa
    - chmod 600 id_rsa
    - ssh -o StrictHostKeyChecking=no -i id_rsa ubuntu@22.218.29.200 "
        cd /home/ubuntu/docker &&
        APP_VERSION=$CI_COMMIT_TAG docker compose up -d
      "
